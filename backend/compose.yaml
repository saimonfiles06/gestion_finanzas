name: gestion-finanzas

services:
  web:
    build: .
    container_name: gestion-finanzas-web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: gestion-finanzas-db
    environment:
      MYSQL_DATABASE: gestion_finanzas
      MYSQL_USER: gestion_finanzas_user
      MYSQL_PASSWORD: Finanzas_Aula_2026
      MYSQL_ROOT_PASSWORD: Finanzas_Root_2026
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: gestion-finanzas-phpmyadmin
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: